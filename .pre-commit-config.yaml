# Install once from the repo root:  uv run --project src pre-commit install
# Run on everything:               uv run --project src pre-commit run --all-files
# Hook revisions are pinned to full commit SHAs; update with
#   pre-commit autoupdate --freeze
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19  # frozen: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: eeca16c54e09b4d9a848259e46bae14737944348  # frozen: 0.13.5
    hooks:
      - id: uv-lock
        args: [--project, src]
        files: ^src/(uv\.lock|pyproject\.toml)$
