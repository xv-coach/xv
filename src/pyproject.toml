[project]
name = "xv-rugby"
version = "0.1.0"
description = "CMS For Rugby"
authors = [{ name = "Nagatatz", email = "nagata.hbdc@gmail.com" }]
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django (>=6.1.2,<6.2)",
    "psycopg[binary] (>=3.3.6,<4)",
    "uwsgi (>=2.0.31,<2.1)",
]

[dependency-groups]
dev = [
    "black (>=26.10.1)",
    "ruff (>=0.17.2)",
]

[tool.poetry]
package-mode = false

[tool.black]
target-version = ["py314"]
skip-string-normalization = true

[tool.ruff]
target-version = "py314"
extend-exclude = ["*/migrations/*"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
