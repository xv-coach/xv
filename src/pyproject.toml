[project]
name = "xv-rugby"
version = "0.1.0"
description = "CMS For Rugby"
authors = [{ name = "Nagatatz", email = "nagata.hbdc@gmail.com" }]
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=6.1.2,<6.2",
    "gunicorn>=26.2.0,<27",
    "psycopg[binary]>=3.3.6,<4",
    "whitenoise>=6.12.0,<7",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.uv]
# Django project, not a distributable package.
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["common", "master", "member", "match", "xv_rugby"]

[tool.ruff.format]
quote-style = "single"
