volumes:
  postgres:
    driver: ${VOLUMES_DRIVER:-local}

services:
  postgres:
    image: postgres:18-alpine
    env_file: .env
    environment:
      TZ: Asia/Tokyo
    volumes:
      # postgres 18+ images keep data under /var/lib/postgresql/<major>/docker
      - postgres:/var/lib/postgresql
    # The DB port is not published to the host by default.
    # Uncomment for local debugging with a GUI client:
    # ports:
    #   - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
  nginx:
    build: containers/nginx
    ports:
      - "${NGINX_HOST_HTTP_PORT:-8000}:8000"
    volumes:
      - ${NGINX_CONF_PATH}:/etc/nginx/conf.d/default.conf
      - ${NGINX_UWSGI_PARAMS}:/etc/nginx/uwsgi_params
      - ${STATIC_FILES}:/static
      - ${NGINX_LOG}:/var/log/nginx
    depends_on:
      - django
  django:
    build:
      context: ./
      dockerfile: ./containers/django/Dockerfile
      args:
        PROJECT_ENV: ${PROJECT_ENV:-development}
    command: uwsgi --ini /code/xv_rugby/django.ini
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    volumes:
      - ${DJANGO_SOURCE}:/code
      - ${STATIC_FILES}:/static
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
