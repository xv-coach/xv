volumes:
  postgres:
    driver: ${VOLUMES_DRIVER:-local}

services:
  postgres:
    image: postgres:18-alpine
    env_file: .env
    environment:
      TZ: Asia/Tokyo
    volumes:
      # postgres 18+ images keep data under /var/lib/postgresql/<major>/docker
      - postgres:/var/lib/postgresql
    # The DB port is not published to the host by default.
    # Uncomment for local debugging with a GUI client:
    # ports:
    #   - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
  django:
    build:
      context: ./
      dockerfile: ./containers/django/Dockerfile
      args:
        PROJECT_ENV: ${PROJECT_ENV:-development}
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    volumes:
      - ${DJANGO_SOURCE:-./src}:/code
    ports:
      - "${DJANGO_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
